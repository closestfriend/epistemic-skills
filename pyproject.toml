[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistemic-skills"
version = "1.0.0"
description = "Epistemic Ledger & Deterministic Skill Compiler for AI Agents"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Hunter Noah Karman" }
]
keywords = ["ai-agents", "agent-skills", "epistemic-ledger", "llm-eval", "benchflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
epistemic-skills = "epistemic_skills.cli:main"
skill-lift = "epistemic_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
