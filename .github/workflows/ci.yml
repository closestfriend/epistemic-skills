name: CI & Epistemic Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Run Epistemic Linter on Track 1 Static Library & Track 2 Meta-Skill
        run: |
          skill-lift lint library/skills --verbose
          skill-lift lint track2/meta --verbose
          python3 track2/meta/skill-creator/scripts/verify_claims.py track2/meta/skill-creator library/skills

      - name: Verify Deterministic Packaging Build
        run: |
          skill-lift package --library library/skills --version 1.0.0 --out /tmp/dist-track1
          skill-lift package --library track2/meta --label track2-meta-v1.0.0 --out /tmp/dist-track2
          test -f /tmp/dist-track1/skills-v1.0.0.zip
          test -f /tmp/dist-track2/skills-track2-meta-v1.0.0.zip
