name: CI & Epistemic Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Run Epistemic Linter on Skills Library
        run: |
          skill-lift lint library/skills --verbose

      - name: Verify Deterministic Packaging Build
        run: |
          skill-lift package --library library/skills --version 1.0.0 --out dist
          test -f dist/skills-v1.0.0.zip
          test -f dist/manifest.json
          test -f dist/RELEASE-CERTIFICATE.md
          echo "Build artifact SHA256: $(sha256sum dist/skills-v1.0.0.zip | awk '{print $1}')"
